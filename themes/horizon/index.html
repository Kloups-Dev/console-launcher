<div class="hz" data-region="root">
  <header class="hz-top">
    <div class="hz-brand">Console Launcher</div>
    <div class="hz-status">
      <span class="hz-pad" id="hz-pad"></span>
      <span class="hz-clock" id="hz-clock"></span>
    </div>
  </header>

  <nav class="hz-systems" id="hz-systems" data-region="systems" aria-label="Systems"></nav>

  <main class="hz-body">
    <ul class="hz-games" id="hz-games" data-region="games" aria-label="Games"></ul>
    <aside class="hz-detail" id="hz-detail" data-region="detail"></aside>
  </main>

  <footer class="hz-help" id="hz-help"></footer>
  <div class="hz-session" id="hz-session" hidden></div>
</div>
