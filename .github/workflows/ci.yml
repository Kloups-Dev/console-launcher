name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

env:
  QT_VERSION: "6.8.*"          # latest long-term support series
  SDL2_VERSION: "2.32.10"
  PRESENTMON_VERSION: "2.6.0"
  MANGOHUD_VERSION: "0.8.4"

jobs:
  engine:
    name: engine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: Command-line tool
        run: cargo run -p cl-cli -- --help

  windows:
    name: package (Windows)
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: win64_msvc2022_64
          cache: true
      - name: SDL2
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\sdl2.zip"
          Invoke-WebRequest -Uri "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL2_VERSION/SDL2-devel-$env:SDL2_VERSION-VC.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\sdl2" -Force
          $root = ("$env:RUNNER_TEMP\sdl2\SDL2-$env:SDL2_VERSION") -replace '\\', '/'
          Get-ChildItem "$root/cmake" | Select-Object -ExpandProperty Name
          "SDL2_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Ninja
        run: choco install ninja -y --no-progress
      # PowerShell: in bash, Git's own `link` would hide the MSVC linker.
      - name: Build
        shell: pwsh
        run: |
          cargo build --release -p cl-ffi -p cl-cli
          if ($LASTEXITCODE) { exit 1 }
          cmake -S qt-prototype -B build -G Ninja -DCMAKE_BUILD_TYPE=Release `
            -DCL_ENGINE_PREBUILT_DIR="$PWD/target/release" -DSDL2_DIR="$env:SDL2_ROOT/cmake" *>&1 | Tee-Object build.log
          if ($LASTEXITCODE) { $m = (Get-Content build.log -Tail 40) -join '%0A'; Write-Output "::error::$m"; exit 1 }
          cmake --build build *>&1 | Tee-Object build.log
          if ($LASTEXITCODE) { $m = (Select-String -Path build.log -Pattern 'error' | Select-Object -First 30 | ForEach-Object { $_.Line }) -join '%0A'; Write-Output "::error::$m"; exit 1 }
      - name: Collect files
        shell: bash
        run: |
          set -eo pipefail
          exec > >(tee step.log) 2>&1
          trap 'echo "::error::$(tail -40 step.log | sed -e ":a" -e "N" -e "\$!ba" -e "s/\n/%0A/g")"' ERR
          out=dist/ConsoleLauncher
          mkdir -p "$out/tools/presentmon"
          cp build/console-launcher-qt.exe build/console_launcher_engine.dll "$out/"
          cp target/release/clctl.exe "$out/"
          cp -r build/themes "$out/themes"
          cp "$SDL2_ROOT/lib/x64/SDL2.dll" "$out/"
          windeployqt --release --no-translations --qmldir qt-prototype/themes --qmldir qt-prototype/ui "$out/console-launcher-qt.exe"
          # Frame measurement tool (MIT), shipped next to the launcher.
          gh release download "v${PRESENTMON_VERSION}" --repo GameTechDev/PresentMon \
            --pattern "PresentMon-${PRESENTMON_VERSION}-x64.exe" --dir "$out/tools/presentmon"
          curl -fsSL -o "$out/tools/presentmon/LICENSE.txt" \
            "https://raw.githubusercontent.com/GameTechDev/PresentMon/v${PRESENTMON_VERSION}/LICENSE.txt"
          cp CHANGELOG.md docs/prototype/config.example.toml "$out/"
          echo "::notice title=Windows package::Qt $(qmake -query QT_VERSION), $(ls "$out/tools/presentmon" | tr '\n' ' '), $(du -sh "$out" | cut -f1)"
      # Starts the packaged launcher on the Windows runner: the theme must
      # load. The launcher's log is shown in the run summary either way.
      - name: Smoke test
        shell: pwsh
        run: |
          $dir = "dist/ConsoleLauncher"
          $env:CONSOLE_LAUNCHER_HOME = "$env:RUNNER_TEMP\cl-home"
          $p = Start-Process -FilePath "$dir/console-launcher-qt.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); $code = 2 } else { $code = $p.ExitCode }
          $log = if (Test-Path "$dir/console-launcher.log") { (Get-Content "$dir/console-launcher.log") -join '%0A' } else { "no log file" }
          if ($code -eq 0) { Write-Output "::notice title=Smoke test (Windows)::$log" }
          else { Write-Output "::error title=Smoke test (Windows), exit $code::$log"; exit 1 }
          Remove-Item "$dir/console-launcher.log", "$dir/console-launcher-engine.log" -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: console-launcher-qt-windows-x64
          path: dist

  linux:
    name: package (Linux AppImage)
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsdl2-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libgl1-mesa-dev libfuse2 file xvfb
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: package
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          cache: true
      - name: Build
        run: |
          set -o pipefail
          report() { echo "::error::$(grep -iE "error|cannot|could not|not found" build.log | head -30 | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"; exit 1; }
          cmake -S qt-prototype -B build -DCMAKE_BUILD_TYPE=Release 2>&1 | tee build.log || report
          cmake --build build -j 2>&1 | tee build.log || report
      - name: AppImage
        run: |
          set -eo pipefail
          exec > >(tee step.log) 2>&1
          trap 'echo "::error::$(tail -40 step.log | sed -e ":a" -e "N" -e "\$!ba" -e "s/\n/%0A/g")"' ERR
          app=AppDir/usr/bin
          mkdir -p "$app/tools/mangohud"
          cp build/console-launcher-qt build/libconsole_launcher_engine.so build/cargo/release/clctl "$app/"
          cp -r build/themes "$app/themes"
          # Frame measurement tool (MIT), shipped with the launcher.
          gh release download "v${MANGOHUD_VERSION}" --repo flightlessmango/MangoHud --pattern "MangoHud-*.tar.gz" --dir mh
          tar -xzf mh/MangoHud-*.tar.gz -C mh
          mkdir mh/pkg && tar -xf mh/MangoHud/MangoHud-package.tar -C mh/pkg
          find mh/pkg -path '*lib32*' -prune -o -name 'libMangoHud*.so' -print -exec cp {} "$app/tools/mangohud/" \;
          curl -fsSL -o "$app/tools/mangohud/LICENSE" \
            "https://raw.githubusercontent.com/flightlessmango/MangoHud/v${MANGOHUD_VERSION}/LICENSE"
          ls -l "$app/tools/mangohud"
          test -f "$app/tools/mangohud/libMangoHud_shim.so"
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-qt https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy linuxdeploy-plugin-qt
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          export QML_SOURCES_PATHS="$PWD/qt-prototype/themes:$PWD/qt-prototype/ui"
          export EXTRA_QT_MODULES="svg"
          export LDAI_OUTPUT=ConsoleLauncher-x86_64.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1
          ./linuxdeploy --appdir AppDir \
            --executable "$app/console-launcher-qt" \
            --library "$app/libconsole_launcher_engine.so" \
            --desktop-file qt-prototype/packaging/console-launcher.desktop \
            --icon-file qt-prototype/packaging/console-launcher.png \
            --plugin qt --output appimage
          mkdir dist && mv ConsoleLauncher-x86_64.AppImage dist/ && cp CHANGELOG.md dist/
          echo "::notice title=Linux package::Qt $("$QT_ROOT_DIR/bin/qmake" -query QT_VERSION), $(ls AppDir/usr/bin/tools/mangohud | tr '\n' ' '), $(du -h dist/ConsoleLauncher-x86_64.AppImage | cut -f1)"
      - name: Smoke test
        run: |
          set +e
          export APPIMAGE_EXTRACT_AND_RUN=1 CONSOLE_LAUNCHER_HOME="$RUNNER_TEMP/cl-home" QT_QUICK_BACKEND=software
          timeout 60 xvfb-run -a dist/ConsoleLauncher-x86_64.AppImage --smoke-test > smoke.txt 2>&1
          code=$?
          log="$(grep -v '^$' smoke.txt | tail -30 | sed -e ':a' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
          if [ $code -eq 0 ]; then echo "::notice title=Smoke test (Linux)::$log"; else echo "::error title=Smoke test (Linux), exit $code::$log"; exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: console-launcher-qt-linux-x64
          path: dist

  # Pre-release with both packages, created automatically:
  # - on a push to the release branch, when its version (Cargo.toml) has no
  #   release yet: tag "v<version>-qt" is created on the pushed commit;
  # - on a pushed tag "v…" (or a release created from the GitHub page).
  # Notes = this version's section of CHANGELOG.md.
  release:
    name: pre-release
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/feat/qt-quick-comparison')
    needs: [engine, windows, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish
        run: |
          set -e
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}-qt"
            # Same version already published: nothing to do until the
            # version number changes.
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              echo "::notice title=Pre-release::$tag already published; bump the version to publish again."
              exit 0
            fi
          fi
          # Branches holding the tagged commit (for the notes).
          git fetch -q origin '+refs/heads/*:refs/remotes/origin/*'
          branch="$(git branch -r --contains "$GITHUB_SHA" | sed 's#origin/##; s/^ *//' | grep -v '^HEAD' | head -1)"
          mkdir out
          (cd artifacts/console-launcher-qt-windows-x64 && zip -qr "../../out/ConsoleLauncher-${version}-windows-x64.zip" ConsoleLauncher)
          cp artifacts/console-launcher-qt-linux-x64/ConsoleLauncher-x86_64.AppImage "out/ConsoleLauncher-${version}-x86_64.AppImage"
          # Notes: header, then this version's changelog section.
          {
            echo "Test build of the Qt Quick interface, branch \`$branch\`. Not a final release."
            echo
            echo "Version de test de l'interface Qt Quick, branche \`$branch\`. Ce n'est pas une version finale."
            echo
            awk -v v="## [${version}]" 'index($0, v) == 1 {on=1; next} on && /^## \[/ {exit} on {print}' CHANGELOG.md
          } > notes.md
          # A release made from the GitHub page (which creates the tag) is
          # completed with the packages; otherwise the release is created.
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" out/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease --latest=false --notes-file notes.md
          else
            gh release create "$tag" out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --prerelease --latest=false --title "Console Launcher ${version} (Qt Quick, test)" --notes-file notes.md
          fi
          echo "::notice title=Pre-release::$tag published"
