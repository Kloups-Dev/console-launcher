name: Windows prototype
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build desktop
        run: dotnet build src/Launcher.Desktop/Launcher.Desktop.csproj --configuration Release
      - name: Check navigation, storage and sessions
        run: dotnet run --project tests/Launcher.Checks/Launcher.Checks.csproj --configuration Release
      - name: Publish portable folder (requires .NET Desktop 8)
        run: dotnet publish src/Launcher.Desktop/Launcher.Desktop.csproj --configuration Release --self-contained false -o dist/windows
      - uses: actions/upload-artifact@v4
        with:
          name: console-launcher-windows-prototype
          path: dist/windows
